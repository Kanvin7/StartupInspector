  </defs>

  <!-- 底板 -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#plate)"/>
  <ellipse cx="170" cy="146" rx="118" ry="84" fill="#FFFFFF" opacity="0.30"/>

