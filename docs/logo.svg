  <ellipse cx="279" cy="250" rx="9" ry="12" fill="#3F3D56"/>
  <ellipse cx="216" cy="274" rx="13" ry="9" fill="#FFB3C7"/>
  <ellipse cx="296" cy="274" rx="13" ry="9" fill="#FFB3C7"/>
  <path d="M239 278 Q256 296 273 278" stroke="#3F3D56" stroke-width="9"
